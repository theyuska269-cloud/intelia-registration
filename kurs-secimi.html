<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kurs seçimi - Intelia Academy</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#eef4f7;
    padding:30px;
}

.container {
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
}

h1 {
    color:#005b70;
}

.course {
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    margin:10px 0;
    cursor:pointer;
}

.course:hover {
    background:#e8f7f7;
}

button {
    width:100%;
    padding:15px;
    background:#007f83;
    color:white;
    border:none;
    border-radius:8px;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>📚 Kurs seçimi</h1>

<p>Növbəti mərhələ üçün kurs seçin.</p>


<div class="course">
<input type="radio" name="course" value="IT Specialist">
IT Specialist
</div>


<div class="course">
<input type="radio" name="course" value="Web Development">
Web Development
</div>


<div class="course">
<input type="radio" name="course" value="Digital Marketing">
Digital Marketing
</div>


<button onclick="continueStep()">
Davam et
</button>


</div>


<script>

function continueStep(){

const selected =
document.querySelector(
'input[name="course"]:checked'
);


if(!selected){

alert("Zəhmət olmasa kurs seçin.");
return;

}


localStorage.setItem(
"selectedCourse",
selected.value
);


window.location.href =
"./qrup-secimi.html";

}

</script>


</body>
</html>
